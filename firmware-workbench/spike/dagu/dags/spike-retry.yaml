# Spike 4:基础设施失败重试 1 次;产品失败不自动重试(phase-0 第 8 节 4 项)
env:
  - PATH: "D:/roon/workflow_2/dsh-env/runtime/node;${PATH}"
  - SPIKE_FLAGFILE: "D:/roon/workflow_2/firmware-workbench/spike/dagu/results/flag-infra.txt"
steps:
  - name: infra-fails-once
    command: node -e "const fs=require('fs'); if(!fs.existsSync(process.env.SPIKE_FLAGFILE)){fs.writeFileSync(process.env.SPIKE_FLAGFILE,'x'); process.exit(2)} console.log('infra recovered on retry')"
    retry_policy:
      limit: 2
      interval_sec: 1
  - name: product-fail-no-retry
    command: node -e "console.log('product defect'); process.exit(1)"
    retry_policy:
      limit: 3
      interval_sec: 1
